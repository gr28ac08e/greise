name: Déployer Greise sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Restaurer les articles RSS et MP3 déjà collectés
        uses: actions/cache/restore@v6
        with:
          path: |
            src/content/rss
            public/audio
          key: greise-rss-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: greise-rss-v3-${{ runner.os }}-
      - name: Restaurer depuis la sauvegarde si le cache est vide
        run: bash scripts/restore-sauvegarde.sh
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site statique
        run: npm run build
      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
