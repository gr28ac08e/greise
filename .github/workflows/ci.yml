name: Vérifier le build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Vérifier que la bibliothèque Supabase épinglée existe sur le CDN
        run: |
          url=$(grep -rhoE "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@[0-9.]+/\+esm" public/comments.js | head -1)
          echo "$url"
          test -n "$url"
          curl -sfI "$url" > /dev/null
      - name: Tester le recoupement
        run: npm test
      - name: Construire le site
        run: npm run build
      - name: Test de bout en bout (sujets factices, pages et flux RSS)
        run: |
          node tests/make-fixture.mjs
          npm run summarize
          npm run build
          node tests/check-dist.mjs
