name: Collecter et publier les actualités

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Restaurer le cache des articles et MP3
        uses: actions/cache@v4
        with:
          path: |
            src/content/articles
            public/audio
          key: greise-content-${{ github.run_id }}
          restore-keys: greise-content-
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Collecter les flux RSS
        run: npm run fetch
        continue-on-error: true
      - name: Générer les résumés en français
        run: npm run summarize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
      - name: Générer les fichiers audio MP3 (si clé configurée)
        run: npm run audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
      - name: Construire le site
        run: npm run build
      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
